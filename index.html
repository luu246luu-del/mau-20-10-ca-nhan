<!DOCTYPE html>
<html lang="vi" style="color-scheme: only light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <title>Món Quà 20/10 Dành Tặng Công Chúa Của Anh 💖</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@1,700;1,900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      color-scheme: only light;
      forced-color-adjust: none;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      forced-color-adjust: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06010c;
      font-family: 'Quicksand', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Canvas 3D Three.js chính */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    /* Canvas 3D chuyên dụng cho Hiệu ứng Video 1 & Video 2 (Độ nét cao + Unreal Bloom) */
    #cine-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #cine-canvas.active {
      opacity: 1;
    }

    /* Canvas hiệu ứng chạm tay & pháo hoa tim */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 8;
      pointer-events: none;
    }

    #ui-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 15;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* =====================================================================
       1. MÀN HÌNH CAPTCHA "XÁC MINH CÔNG CHÚA" (CHUẨN TỶ LỆ ẢNH)
       ===================================================================== */
    #captcha-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 50% 35%, rgba(75, 12, 55, 0.94) 0%, rgba(8, 2, 14, 0.98) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      pointer-events: auto;
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    #captcha-screen.unlocked {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.08);
    }

    #reprincess-widget {
      width: 100%;
      max-width: 345px;
      background: #fff8fb;
      border: 2px solid #ff9ec7;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 15px 40px rgba(255, 20, 147, 0.38), 0 0 0 4px rgba(255, 182, 193, 0.18);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    #reprincess-widget:hover {
      transform: translateY(-2px);
    }
    .rp-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #rp-checkbox {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2.5px solid #e91e63;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    #rp-checkbox.loading {
      border-radius: 50%;
      border-color: #ff4081 transparent #ff4081 transparent;
      animation: spinLoader 0.55s linear infinite;
    }
    .rp-text {
      color: #4a0e2e;
      font-size: 15px;
      font-weight: 700;
    }
    .rp-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #ad1457;
      font-size: 9.5px;
      font-weight: 700;
    }
    .rp-logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #ff4081, #c2185b);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
    }

    #captcha-challenge-box {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.78), 0 0 38px rgba(255, 64, 129, 0.48);
      border: 2.5px solid #ff9ec7;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    #captcha-challenge-box.active {
      display: flex;
      animation: popInModal 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #captcha-challenge-box.error-shake {
      animation: errorShake 0.4s ease;
    }

    .cc-header {
      background: linear-gradient(135deg, #ec407a 0%, #d81b60 55%, #ad1457 100%);
      color: #ffffff;
      padding: 13px 15px;
      border-radius: 9px;
    }
    .cc-header-line1 {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.95;
    }
    .cc-header-line2 {
      font-size: 21px;
      font-weight: 700;
      margin: 2px 0 3px;
    }

    #cc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #fce4ec;
      padding: 5px;
      border-radius: 9px;
    }
    .cc-tile {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f8bbd0;
      border-radius: 7px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    /* Căn chỉnh ảnh Captcha chuẩn 100% không méo, lấy tâm khuôn mặt */
    .cc-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
      transition: transform 0.25s ease;
    }
    .cc-tile:hover img {
      transform: scale(1.04);
    }
    .cc-tile.selected {
      transform: scale(0.88);
      border-radius: 9px;
      box-shadow: 0 0 0 3px #ff1493, 0 5px 15px rgba(255, 20, 147, 0.45);
    }
    .cc-tile.hint-glow {
      box-shadow: 0 0 0 3px #ff4081, 0 0 16px #ff1493;
    }
    .cc-check-circle {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ff1493;
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.18s ease;
      z-index: 4;
    }
    .cc-tile.selected .cc-check-circle {
      opacity: 1;
      transform: scale(1);
    }

    #cc-status-msg {
      min-height: 20px;
      font-size: 12.5px;
      font-weight: 700;
      color: #d81b60;
      text-align: center;
      padding: 2px 6px;
    }

    .cc-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 6px 2px;
      border-top: 1px solid #f8bbd0;
    }
    .cc-tools {
      display: flex;
      gap: 12px;
      color: #880e4f;
      font-size: 18px;
    }
    .cc-tool-btn {
      cursor: pointer;
      opacity: 0.85;
    }
    #cc-verify-btn {
      background: linear-gradient(135deg, #ff4081, #d81b60);
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 9px 24px;
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(216, 27, 96, 0.45);
    }

    /* =====================================================================
       2. GIAO DIỆN 3D & NÚT ĐIỀU KHIỂN
       ===================================================================== */
    #audio-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 64, 129, 0.28);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 192, 203, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 64, 129, 0.5);
      z-index: 120;
    }

    #top-right-hud {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #top-right-hud.show {
      opacity: 1;
      pointer-events: auto;
    }
    .hud-counter-pill {
      background: rgba(30, 6, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 130, 185, 0.6);
      color: #ffd6e8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .mode-pills {
      display: flex;
      gap: 6px;
    }
    .mode-btn {
      background: rgba(255, 64, 129, 0.22);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 192, 203, 0.5);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 16px;
      font-family: 'Quicksand', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #ff1493;
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.7);
    }

    #hold-start-ui {
      position: absolute;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    #hold-start-ui.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .hold-caption {
      color: #ffd1e8;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-shadow: 0 0 12px rgba(255, 20, 147, 0.9);
    }
    #hold-circle-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: radial-gradient(circle, rgba(255, 64, 129, 0.38) 0%, rgba(136, 14, 79, 0.22) 100%);
      border: 1.5px solid rgba(255, 192, 203, 0.75);
      box-shadow: 0 0 28px rgba(255, 64, 129, 0.65);
    }
    #hold-svg-ring {
      position: absolute;
      top: -5px;
      left: -5px;
      width: 84px;
      height: 84px;
      transform: rotate(-90deg);
    }
    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 3.5;
    }
    .ring-prog {
      fill: none;
      stroke: #ff2a85;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 239;
      stroke-dashoffset: 239;
    }

    #bottom-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      display: flex;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    #bottom-bar.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .pill-action-btn {
      padding: 11px 26px;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff2a85, #c2185b);
      border: 1.5px solid #ffffff;
      color: #ffffff;
      font-family: 'Quicksand', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(255, 20, 147, 0.6);
      white-space: nowrap;
      transition: transform 0.15s ease;
    }
    .pill-action-btn:active {
      transform: scale(0.94);
    }

    /* =====================================================================
       3. POPUP GHI CHÚ KỶ NIỆM (KHUNG ẢNH THÔNG MINH KHÔNG BỊ MÉO/CẮT)
       ===================================================================== */
    #memory-note-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: 90%;
      max-width: 375px;
      background: #fff5f9;
      border: 2.5px solid #ffffff;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.78), 0 0 32px rgba(255, 105, 180, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.25);
    }
    #memory-note-popup.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .mn-tag {
      background: #ffd6e7;
      color: #9c1448;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 14px;
    }
    /* Khung ảnh thông minh có nền mờ đồng bộ giúp ảnh dọc hay ngang đều vừa khít 100% */
    .mn-img-frame {
      position: relative;
      width: 100%;
      height: 255px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #ffffff;
      box-shadow: 0 6px 18px rgba(136, 19, 55, 0.22);
      background: #2a0818;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mn-img-blur {
      position: absolute;
      inset: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      object-fit: cover;
      filter: blur(14px) brightness(0.75);
      z-index: 1;
    }
    #mn-img {
      position: relative;
      z-index: 2;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }
    #mn-title {
      font-family: 'Dancing Script', cursive;
      font-size: 26px;
      font-weight: 700;
      color: #881337;
      text-align: center;
    }
    #mn-desc {
      font-size: 14px;
      line-height: 1.5;
      color: #4a1026;
      font-weight: 600;
      text-align: center;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px dashed #ff85b3;
      width: 100%;
    }
    .mn-btn-row {
      display: flex;
      gap: 7px;
      width: 100%;
    }
    .mn-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 11px;
      border: none;
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .mn-btn.close {
      background: #ffd6e7;
      color: #881337;
    }
    .mn-btn.next {
      background: linear-gradient(135deg, #ff4081, #d81b60);
      color: #ffffff;
    }
    .mn-btn.letter {
      background: linear-gradient(135deg, #9c27b0, #e91e63);
      color: #ffffff;
    }

    /* =====================================================================
       4. PHONG BÌ CÓ CÁNH THIÊN THẦN & BỨC THƯ TỰ GIÃN HOÀN HẢO
       ===================================================================== */
    #angel-envelope-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 120px) scale(0.5);
      width: 280px;
      height: 140px;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      filter: drop-shadow(0 0 28px rgba(255, 105, 180, 0.9));
      transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 60;
    }
    #angel-envelope-wrap.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .envelope-visual-row {
      position: relative;
      width: 260px;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatEnvelope 2s infinite ease-in-out;
    }
    .wing-svg {
      position: absolute;
      top: 10px;
      width: 82px;
      height: 64px;
      z-index: 1;
      pointer-events: none;
    }
    .wing-svg.left {
      left: 4px;
      transform-origin: 95% 55%;
      animation: flapWingL 0.5s infinite ease-in-out alternate;
    }
    .wing-svg.right {
      right: 4px;
      transform-origin: 5% 55%;
      animation: flapWingR 0.5s infinite ease-in-out alternate;
    }
    .env-card {
      width: 110px;
      height: 74px;
      background-color: #ffffff !important;
      background-image: linear-gradient(160deg, #ffffff 0%, #ffe8f2 100%) !important;
      border-radius: 10px;
      border: 2.5px solid #ffb8d9;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(233, 30, 99, 0.55);
    }
    .env-flap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .env-tap-hint {
      margin-top: 8px;
      color: #ffe4f2;
      font-size: 13.5px;
      font-weight: 700;
      text-shadow: 0 0 10px #ff1493;
      letter-spacing: 0.4px;
    }

    #final-letter-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.88);
      width: 92%;
      max-width: 460px;
      opacity: 0;
      pointer-events: none;
      z-index: 70;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    #final-letter-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    #expanding-card {
      position: relative;
      width: 100%;
      max-height: 88vh;
      background-color: #ffeef5 !important;
      background-image: radial-gradient(circle at 50% 30%, #fffdfd 0%, #ffe6f0 58%, #ffc8e0 100%) !important;
      border-radius: 22px;
      border: 2.5px solid #ffffff;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.7), 0 0 38px rgba(255, 105, 180, 0.5);
      padding: 26px 22px 24px;
      height: 92px;
      overflow: hidden;
      transition: height 0.16s ease-out;
    }
    #expanding-card.finished-expanding {
      height: auto !important;
      overflow-y: auto;
    }
    .butterfly-corner-tl {
      position: absolute;
      top: 4px;
      left: 6px;
      width: 40px;
      height: 40px;
      z-index: 6;
      pointer-events: none;
    }
    .bow-corner-tr {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 38px;
      height: 38px;
      z-index: 6;
      pointer-events: none;
    }
    #letter-box-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }
    #letter-title-el {
      font-family: 'Dancing Script', cursive;
      font-size: 27px;
      font-weight: 700;
      color: #9e1142 !important;
      margin-bottom: 10px;
      min-height: 34px;
    }
    #letter-body-el {
      font-family: 'Dancing Script', cursive;
      font-size: 20.5px;
      line-height: 1.52;
      font-weight: 700;
      color: #4c0519 !important;
      white-space: pre-wrap;
      width: 100%;
    }
    .caret-bar {
      display: inline-block;
      width: 2.5px;
      height: 20px;
      background-color: #e11d48;
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: blinkCaret 0.65s infinite;
    }

    /* KHUNG ẢNH ĐÔI LỨA CUỐI THƯ CHUẨN TỶ LỆ 100% KHÔNG CẮT MẶT */
    #letter-couple-wrap {
      position: relative;
      width: 86%;
      max-width: 300px;
      height: 210px;
      margin-top: 16px;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 24px rgba(136, 19, 55, 0.32);
      background: #2a0818;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px) scale(0.95);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      flex-shrink: 0;
    }
    #letter-couple-wrap.show-photo {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    #letter-couple-blur {
      position: absolute;
      inset: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      object-fit: cover;
      filter: blur(14px) brightness(0.75);
      z-index: 1;
    }

  <script id="particle-vs" type="x-shader/x-vertex">
    attribute vec3 aTarget;
    attribute vec3 aColor;
    attribute vec3 aRandom;

    uniform float uTime;
    uniform float uMorph;
    uniform float uScanline;
    uniform float uVortex;
    uniform float uWarp;

    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      vColor = aColor;
      vec3 pos = mix(position, aTarget, uMorph);

      if (uScanline > 0.001) {
        pos.x += sin(pos.y * 38.0 + uTime * 24.0) * uScanline * 24.0 * (0.4 + aRandom.y);
      }

      if (uVortex > 0.001) {
        float ang = uVortex * 6.0 * (0.8 + aRandom.z);
        float s = sin(ang), c = cos(ang);
        pos.xy = vec2(pos.x * c - pos.y * s, pos.x * s + pos.y * c) * mix(1.0, 0.18, uVortex);
      }

      if (uWarp > 0.001) {
        pos.z += uWarp * (160.0 + aRandom.x * 230.0);
        pos.xy *= (1.0 + uWarp * 1.7);
      }

      pos.x += sin(uTime * 2.2 + aRandom.x * 12.0) * 0.16;
      pos.y += cos(uTime * 2.0 + aRandom.y * 12.0) * 0.16;

      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPos;

      gl_PointSize = (1.65 + aRandom.x * 1.55) * (125.0 / max(-mvPos.z, 12.0));
      vAlpha = smoothstep(420.0, 18.0, -mvPos.z);
    }
  </script>

  <script id="particle-fs" type="x-shader/x-fragment">
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      vec2 uv = gl_PointCoord.xy - 0.5;
      float r = length(uv);
      if (r > 0.5) discard;

      float core = smoothstep(0.5, 0.0, r);
      vec3 finalCol = mix(vColor, vec3(1.0, 0.95, 0.98), pow(core, 3.0) * 0.55);
      float alpha = smoothstep(0.5, 0.05, r) * vAlpha * 0.92;
      gl_FragColor = vec4(finalCol, alpha);
    }
  </script>

    function drawSmartCoverImage(ctx, img, dstX, dstY, dstW, dstH, focusX = 0.5, focusY = 0.25) {
      const srcW = img.naturalWidth || img.width || 500;
      const srcH = img.naturalHeight || img.height || 500;
      const srcRatio = srcW / srcH;
      const dstRatio = dstW / dstH;

      let cropW, cropH, cropX, cropY;
      if (srcRatio > dstRatio) {
        cropH = srcH;
        cropW = srcH * dstRatio;
        cropX = (srcW - cropW) * focusX;
        cropY = 0;
      } else {
        cropW = srcW;
        cropH = srcW / dstRatio;
        cropX = 0;
        cropY = (srcH - cropH) * focusY;
      }
      ctx.drawImage(img, cropX, cropY, cropW, cropH, dstX, dstY, dstW, dstH);
    }

      ctx.moveTo(200, 350);

    // =========================================================================
    // HỆ THỐNG RUNG CAMERA ĐIỆN ẢNH (CINEMATIC CAMERA SHAKE ENGINE)
    // =========================================================================
const camShake = {
      power: 0,
      decay: 0.93, // Giảm dần mượt hơn
      offsetX: 0,
      offsetY: 0,
      trigger(amount = 0.4) {
        // Hạ trần độ rung từ 3.8 xuống 0.8 để chỉ lắc nhẹ nhàng
        this.power = Math.min(0.8, this.power + amount * 0.35);
      },
      update(time) {
        if (this.power > 0.005) {
          this.offsetX = Math.sin(time * 18) * this.power;
          this.offsetY = Math.cos(time * 15) * this.power;
          this.power *= this.decay;
        } else {
          this.power = 0;
          this.offsetX = 0;
          this.offsetY = 0;
        }
      }
    };      

    // =========================================================================
    // HỆ THỐNG ÂM THANH TỰ ĐỘNG PHÁT NGAY TỪ GIÂY ĐẦU TIÊN
    // =========================================================================
    class ProAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.playing = false;
        this.noteIdx = 0;
        this.scale = [523.25, 659.25, 783.99, 1046.5, 987.77, 783.99, 659.25, 587.33];
        this.audioEl = null;

        if (window.LOVE_CONFIG.musicUrl && window.LOVE_CONFIG.musicUrl.trim() !== '') {
          this.audioEl = new Audio(window.LOVE_CONFIG.musicUrl);
          this.audioEl.loop = true;
          this.audioEl.preload = 'auto';
          this.audioEl.volume = 0.88;
        }
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }
      startMusic() {
        this.init();
        if (this.audioEl) {
          if (!this.playing) {
            const p = this.audioEl.play();
            if (p !== undefined) {
              p.then(() => {
                this.playing = true;
              }).catch(() => {
                // Nếu trình duyệt chặn autoplay chưa chạm, giữ trạng thái để chạm nhẹ đầu tiên là phát ngay
              });
            }
          }
        } else if (!this.playing) {
          this.playing = true;
          this.loopMusicBox();
        }
      }
      loopMusicBox() {
        const tick = () => {
          if (!this.playing) return;
          if (!this.muted && this.ctx && this.ctx.state === 'running') {
            this.tone(this.scale[this.noteIdx % this.scale.length], 0.06, 1.35);
            this.noteIdx++;
          }
          setTimeout(tick, 360);
        };
        tick();
      }
      tone(freq, vol = 0.06, dur = 0.35) {
        this.init();
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(vol, now + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.04);
      }
      chime() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.tone(f, 0.06, 0.55), i * 50));
      }
      error() {
        this.tone(175, 0.1, 0.22);
        setTimeout(() => this.tone(140, 0.1, 0.28), 110);
      }
      typeTick() {
        this.tone(1150 + Math.random() * 250, 0.02, 0.035);
      }
      toggle() {
        this.muted = !this.muted;
        if (this.audioEl) this.audioEl.muted = this.muted;
        return !this.muted;
      }
    }

    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;

    const touchRipples = [];
    const touchHearts = [];

    function spawnTouchFX(x, y, isBurst = false) {
      touchRipples.push({ x, y, r: 4, maxR: isBurst ? 105 : 48, alpha: 0.9 });
      const count = isBurst ? 12 : 2;
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = (isBurst ? 2.6 : 0.8) + Math.random() * 2.8;
        touchHearts.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.2,
          size: (isBurst ? 16 : 11) + Math.random() * 10,
          alpha: 1,
          char: ['💖', '✨', '🌸', '💕'][Math.floor(Math.random() * 4)]
        });
      }
    }

    function updateAndDrawTouchFX() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

      for (let i = touchRipples.length - 1; i >= 0; i--) {
        const rp = touchRipples[i];
        rp.r += (rp.maxR - rp.r) * 0.14;
        rp.alpha *= 0.91;
        fxCtx.save();
        fxCtx.strokeStyle = `rgba(255, 105, 180, ${rp.alpha})`;
        fxCtx.lineWidth = 2.2;
        fxCtx.beginPath();
        fxCtx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        fxCtx.stroke();
        fxCtx.restore();
        if (rp.alpha < 0.03) touchRipples.splice(i, 1);
      }

      for (let i = touchHearts.length - 1; i >= 0; i--) {
        const h = touchHearts[i];
        h.x += h.vx;
        h.y += h.vy;
        h.alpha -= 0.022;
        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, h.alpha);
        fxCtx.font = `${h.size}px sans-serif`;
        fxCtx.textAlign = 'center';
        fxCtx.fillText(h.char, h.x, h.y);
        fxCtx.restore();
        if (h.alpha <= 0) touchHearts.splice(i, 1);
      }
    }

    // =========================================================================
    // ENGINE ĐỒ HỌA CANVAS 3D CHO VIDEO 1 (TRÁI TIM HẠT 3D HỒNG) & VIDEO 2 (BƯỚM 3D HỒNG)
    // =========================================================================
    const cineCanvas = document.getElementById('cine-canvas');
    const cineCtx = cineCanvas.getContext('2d');
    let CW = cineCanvas.width = window.innerWidth;
    let CH = cineCanvas.height = window.innerHeight;

    function createPinkGlowSprite(colorCenter, colorMid, colorEdge, isStar = false) {
      const size = isStar ? 96 : 64;
      const off = document.createElement('canvas');
      off.width = off.height = size;
      const c = off.getContext('2d');
      const half = size / 2;

      const grad = c.createRadialGradient(half, half, 0, half, half, half);
      grad.addColorStop(0, colorCenter);
      grad.addColorStop(0.24, colorMid);
      grad.addColorStop(0.58, colorEdge);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = grad;
      c.fillRect(0, 0, size, size);

      if (isStar) {
        c.fillStyle = '#ffffff';
        c.beginPath();
        c.ellipse(half, half, half * 0.86, 1.5, 0, 0, Math.PI * 2);
        c.fill();
        c.beginPath();
        c.ellipse(half, half, 1.5, half * 0.86, 0, 0, Math.PI * 2);
        c.fill();
      }
      return off;
    }

    // Sprites phát sáng hồng phấn, hồng sen và sao 4 cánh
    const spriteHotPink = createPinkGlowSprite('#ffffff', 'rgba(255, 110, 185, 0.9)', 'rgba(216, 27, 96, 0.22)', false);
    const spriteBlushWhite = createPinkGlowSprite('#ffffff', 'rgba(255, 215, 240, 0.95)', 'rgba(235, 100, 195, 0.28)', false);
    const spritePinkStar = createPinkGlowSprite('#ffffff', 'rgba(255, 225, 245, 0.98)', 'rgba(255, 64, 150, 0.3)', true);

    // --- DỮ LIỆU HIỆU ỨNG VIDEO 1: TRÁI TIM TINH VÂN 3D MÀU HỒNG & VÒNG XOÁY ---
    const V1_COUNT = 6500;
    const v1Particles = [];
    const v1Comets = [];
    const v1VortexRibbons = [];

    for (let i = 0; i < V1_COUNT; i++) {
      let u = Math.random() * Math.PI * 2;
      if (Math.random() < 0.36) {
        u = Math.PI + Math.random() * 0.88 * Math.PI; // Cụm sáng dày bên sườn trái giống Video 1
      }
      const shell = Math.pow(Math.random(), 0.32);
      const xBase = 16 * Math.pow(Math.sin(u), 3);
      const yBase = -(13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u));
      const zThickness = 11 * Math.sin(u) * Math.sqrt(Math.max(0, 1 - shell * 0.6));
      const zBase = (Math.random() - 0.5) * 2 * zThickness;

      const x0 = xBase * shell + (Math.random() - 0.5) * 0.8;
      const y0 = yBase * shell - 3.5 + (Math.random() - 0.5) * 0.8;
      const z0 = zBase + (Math.random() - 0.5) * 0.8;

      const isLeftCluster = x0 < -3.5;
      const isStar = isLeftCluster ? Math.random() < 0.085 : Math.random() < 0.025;
      const sprite = isStar ? spritePinkStar : (isLeftCluster ? spriteBlushWhite : spriteHotPink);
      const vulnerability = Math.max(0.15, Math.min(1.0, (y0 + 16) / 22));

      v1Particles.push({
        x0, y0, z0,
        x: x0, y: y0, z: z0,
        sprite,
        baseSize: isStar ? (10 + Math.random() * 14) : (2.6 + Math.random() * 6.5),
        vulnerability,
        swirlPhase: Math.random() * Math.PI * 2,
        swirlSpeed: (1.6 + Math.random() * 2.5) * (Math.random() < 0.5 ? 1 : -1),
        radialSpread: (Math.random() - 0.3) * 14.5,
        dropDist: 4 + Math.random() * 15,
        twinklePhase: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 88; i++) {
      v1Comets.push({
        angle: Math.random() * Math.PI * 2,
        radius: 2 + Math.random() * 13,
        yBase: 2 + Math.random() * 14,
        speedAngle: (2.2 + Math.random() * 3.0) * (Math.random() < 0.5 ? 1 : -1),
        phaseOffset: Math.random() * 1.5,
        tailLength: 9 + Math.floor(Math.random() * 10),
        width: 1.3 + Math.random() * 1.8
      });
    }

    for (let i = 0; i < 65; i++) {
      v1VortexRibbons.push({
        radius: 1.5 + Math.pow(Math.random(), 1.4) * 9.5,
        yOffset: 13.8 + (Math.random() - 0.5) * 1.8,
        angleStart: Math.random() * Math.PI * 2,
        arcLen: 0.65 + Math.random() * 1.8,
        speed: 3.6 + (11 - (1.5 + Math.random() * 9)) * 0.45,
        thickness: 1.6 + Math.random() * 3.5
      });
    }

    function projectV1(x, y, z, scaleFactor) {
      const rotY = -0.18;
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const rx = x * cosY - z * sinY;
      const rz = x * sinY + z * cosY;
      const depth = 42 + rz;
      const p = (420 / Math.max(1, depth)) * scaleFactor;
      return {
        sx: CW / 2 + rx * p + camShake.offsetX * 4,
        sy: CH / 2 + y * p + camShake.offsetY * 4,
        p
      };
    }

    let v1StartTime = 0;
    let v1HoldButtonShown = false;
    let v1EruptionShakeTriggered = false;

    function renderVideo1PinkHeart(now) {
      const rawElapsed = (now - v1StartTime) / 1000;
      const scaleFactor = Math.min(CW, CH) / 480;

      cineCtx.clearRect(0, 0, CW, CH);
      cineCtx.globalCompositeOperation = 'lighter';

      // Giây 1.8 -> 5.0: Nổ hạt & tia sáng xoáy; Giây 5.0 -> 8.2: Hội tụ lại; Sau 8.2s: Đập nhịp nhàng chờ bấm Giữ
      let stormIntensity = 0;
      if (rawElapsed >= 1.8 && rawElapsed < 3.2) {
        if (!v1EruptionShakeTriggered) {
          v1EruptionShakeTriggered = true;
          camShake.trigger(2.4);
          audio.chime();
        }
        const t = (rawElapsed - 1.8) / 1.4;
        stormIntensity = t * t * (3 - 2 * t);
      } else if (rawElapsed >= 3.2 && rawElapsed < 5.0) {
        stormIntensity = 1.0 - Math.sin((rawElapsed - 3.2) * 2) * 0.08;
      } else if (rawElapsed >= 5.0 && rawElapsed < 8.2) {
        const t = (rawElapsed - 5.0) / 3.2;
        stormIntensity = 1.0 - t * t * (3 - 2 * t);
      } else if (rawElapsed >= 8.2 && !v1HoldButtonShown) {
        v1HoldButtonShown = true;
        document.getElementById('hold-start-ui').classList.add('show');
        audio.chime();
      }

      // Khi người dùng ấn giữ nút Hold, tăng hiệu ứng xoáy
      const holdBoost = (holdPct / 100) * 0.85;
      const totalStorm = Math.min(1.2, stormIntensity + holdBoost);

      // 1. Vẽ Đế Lốc Xoáy Năng Lượng Màu Hồng Phấn
      const vortexCenter = projectV1(0, 14.0, 0, scaleFactor);
      const coreRadius = (88 + totalStorm * 38) * scaleFactor;
      const coreGrad = cineCtx.createRadialGradient(
        vortexCenter.sx, vortexCenter.sy, 2,
        vortexCenter.sx, vortexCenter.sy, coreRadius
      );
      coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
      coreGrad.addColorStop(0.28, 'rgba(255, 130, 200, 0.82)');
      coreGrad.addColorStop(0.65, 'rgba(233, 30, 99, 0.28)');
      coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      cineCtx.save();
      cineCtx.translate(vortexCenter.sx, vortexCenter.sy);
      cineCtx.scale(1.6, 0.42);
      cineCtx.fillStyle = coreGrad;
      cineCtx.beginPath();
      cineCtx.arc(0, 0, coreRadius, 0, Math.PI * 2);
      cineCtx.fill();
      cineCtx.restore();

      v1VortexRibbons.forEach(r => {
        const curAngle = r.angleStart + rawElapsed * r.speed * (1 + holdBoost);
        const liftY = totalStorm * Math.sin(curAngle * 2) * 2.5;
        const rad = r.radius * (1 - totalStorm * 0.22);

        cineCtx.beginPath();
        const segs = 14;
        for (let s = 0; s <= segs; s++) {
          const a = curAngle + (s / segs) * r.arcLen;
          const vx = Math.cos(a) * rad;
          const vz = Math.sin(a) * rad;
          const vy = r.yOffset - liftY * (s / segs);
          const pt = projectV1(vx, vy, vz, scaleFactor);
          if (s === 0) cineCtx.moveTo(pt.sx, pt.sy);
          else cineCtx.lineTo(pt.sx, pt.sy);
        }
        cineCtx.strokeStyle = `rgba(255, 145, 210, ${0.38 + 0.32 * Math.sin(rawElapsed * 5 + r.angleStart)})`;
        cineCtx.lineWidth = r.thickness * scaleFactor;
        cineCtx.lineCap = 'round';
        cineCtx.stroke();
      });

      // 2. Vẽ 6.500 Hạt Trái Tim Tinh Vân 3D Màu Hồng
      const pulse = 1 + Math.sin(rawElapsed * 4.2) * 0.025 * (1 - Math.min(1, totalStorm));
      for (let i = 0; i < V1_COUNT; i++) {
        const p = v1Particles[i];
        const eff = totalStorm * p.vulnerability;

        if (eff > 0.001) {
          const swirlA = p.swirlPhase + rawElapsed * p.swirlSpeed * eff;
          const expandR = p.radialSpread * eff;
          p.x = p.x0 + Math.cos(swirlA) * expandR;
          p.z = p.z0 + Math.sin(swirlA) * expandR;
          p.y = p.y0 + p.dropDist * eff * Math.sin(eff * Math.PI * 0.85 + p.swirlPhase * 0.3);
        } else {
          p.x = p.x0 * pulse;
          p.y = p.y0 * pulse;
          p.z = p.z0 * pulse;
        }

        const proj = projectV1(p.x, p.y, p.z, scaleFactor);
        const twinkle = 0.65 + 0.35 * Math.sin(rawElapsed * 4.5 + p.twinklePhase);
        const sizeBoost = 1 + eff * 0.85;
        const drawSize = p.baseSize * (proj.p / 10) * sizeBoost * twinkle;

        cineCtx.globalAlpha = Math.min(1, (0.58 + 0.42 * twinkle) * (1 - eff * 0.22));
        cineCtx.drawImage(
          p.sprite,
          proj.sx - drawSize / 2,
          proj.sy - drawSize / 2,
          drawSize,
          drawSize
        );
      }
      cineCtx.globalAlpha = 1;

      // 3. Vẽ Các Vệt Sao Chổi Màu Hồng Xoáy Lốc (Comet Trails)
      if (totalStorm > 0.02) {
        v1Comets.forEach(c => {
          const localTime = rawElapsed + c.phaseOffset;
          cineCtx.beginPath();
          let headProj = null;

          for (let s = 0; s < c.tailLength; s++) {
            const lag = s * 0.035;
            const tNow = localTime - lag;
            const a = c.angle + tNow * c.speedAngle;
            const cycle = (tNow * 0.75) % 1;
            const yPos = 13.5 - Math.sin(cycle * Math.PI) * (14 + c.yBase * 0.8);
            const rPos = c.radius * (0.4 + 0.8 * Math.sin(cycle * Math.PI));

            const cx = Math.cos(a) * rPos;
            const cz = Math.sin(a) * rPos;
            const pt = projectV1(cx, yPos, cz, scaleFactor);

            if (s === 0) {
              cineCtx.moveTo(pt.sx, pt.sy);
              headProj = pt;
            } else {
              cineCtx.lineTo(pt.sx, pt.sy);
            }
          }

          cineCtx.strokeStyle = `rgba(255, 140, 205, ${Math.min(1, totalStorm * 0.8)})`;
          cineCtx.lineWidth = c.width * scaleFactor;
          cineCtx.lineCap = 'round';
          cineCtx.stroke();

          if (headProj) {
            const headSize = 15 * scaleFactor * Math.min(1, totalStorm);
            cineCtx.drawImage(
              spriteHotPink,
              headProj.sx - headSize / 2,
              headProj.sy - headSize / 2,
              headSize,
              headSize
            );
          }
        });
      }
    }

    // --- DỮ LIỆU HIỆU ỨNG VIDEO 2: TRÁI TIM NGÂN HÀ HỒNG & CHÚ BƯỚM 3D (CHẠY 1 VÒNG 10 GIÂY) ---
    const v2RingParticles = [];
    const v2MiniHearts = [];
    const v2StreamParticles = [];
    const v2PerimeterButterflies = [
      { u: -2.45, size: 0.22, rot: -0.55, phase: 0.2 },
      { u: -1.85, size: 0.17, rot: -0.85, phase: 1.4 },
      { u: -1.35, size: 0.24, rot: -0.35, phase: 2.7 },
      { u: -0.65, size: 0.15, rot: 0.25, phase: 3.9 },
      { u: 0.02,  size: 0.21, rot: 0.10, phase: 0.8 },
      { u: 1.15,  size: 0.18, rot: 0.65, phase: 2.1 },
      { u: 1.65,  size: 0.27, rot: 0.45, phase: 4.2 },
      { u: 2.15,  size: 0.19, rot: 0.75, phase: 1.1 },
      { u: 2.55,  size: 0.22, rot: 0.35, phase: 3.3 }
    ];

    for (let i = 0; i < 1850; i++) {
      const u = (Math.random() * 2 - 1) * Math.PI;
      const rGauss = (Math.random() + Math.random() + Math.random() - 1.5) * 26;
      v2RingParticles.push({
        u,
        offsetDist: rGauss,
        offsetAngle: Math.random() * Math.PI * 2,
        size: 3 + Math.pow(Math.random(), 2.2) * 14,
        twinkleSpeed: 2 + Math.random() * 5,
        phase: Math.random() * Math.PI * 2,
        isBright: Math.random() < 0.3,
        burstFactor: 0.4 + Math.random() * 1.1
      });
    }

    for (let i = 0; i < 30; i++) {
      const isLeft = Math.random() < 0.82;
      const u = isLeft ? -(0.15 + Math.random() * 2.75) : (0.15 + Math.random() * 1.8);
      v2MiniHearts.push({
        u,
        spreadX: (isLeft ? -1 : 1) * (12 + Math.random() * 55) + (Math.random() - 0.5) * 25,
        spreadY: (Math.random() - 0.5) * 45,
        size: 4.5 + Math.random() * 6.5,
        rot: (Math.random() - 0.5) * 0.6,
        shade: Math.random() > 0.45 ? 'light' : 'deep',
        floatSpeed: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 260; i++) {
      v2StreamParticles.push({
        progress: Math.random(),
        speed: 0.25 + Math.random() * 0.35,
        spread: (Math.random() - 0.5) * 22,
        size: 3 + Math.random() * 10,
        phase: Math.random() * Math.PI * 2
      });
    }

    function getV2HeartCoord(u, scale, centerX, centerY) {
      const t = Math.PI - u;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: centerX + x * scale + camShake.offsetX * 3,
        y: centerY + y * scale + camShake.offsetY * 3
      };
    }

    function drawPinkMiniHeart3D(x, y, size, rot, shade, alpha) {
      if (alpha <= 0.01) return;
      cineCtx.save();
      cineCtx.translate(x, y);
      cineCtx.rotate(rot);
      cineCtx.globalAlpha = alpha;

      cineCtx.beginPath();
      cineCtx.moveTo(0, size * 0.35);
      cineCtx.bezierCurveTo(-size * 1.1, -size * 0.4, -size * 0.55, -size * 1.2, 0, -size * 0.45);
      cineCtx.bezierCurveTo(size * 0.55, -size * 1.2, size * 1.1, -size * 0.4, 0, size * 0.35);

      const g = cineCtx.createRadialGradient(-size * 0.25, -size * 0.4, size * 0.1, 0, 0, size * 1.1);
      if (shade === 'light') {
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.5, '#ffc2e2');
        g.addColorStop(1, '#ff2a85');
      } else {
        g.addColorStop(0, '#ff9ec7');
        g.addColorStop(0.6, '#d81b60');
        g.addColorStop(1, '#6a0535');
      }
      cineCtx.fillStyle = g;
      cineCtx.shadowColor = '#ff4081';
      cineCtx.shadowBlur = 8;
      cineCtx.fill();
      cineCtx.restore();
    }

    function drawPinkStarburstFlare(x, y, intensity, scaleFactor) {
      if (intensity <= 0.01) return;
      cineCtx.save();
      cineCtx.translate(x, y);

      const rGlow = 98 * intensity * scaleFactor;
      const g = cineCtx.createRadialGradient(0, 0, 0, 0, 0, rGlow);
      g.addColorStop(0, 'rgba(255, 255, 255, 1)');
      g.addColorStop(0.2, 'rgba(255, 200, 235, 0.95)');
      g.addColorStop(0.5, 'rgba(255, 40, 140, 0.58)');
      g.addColorStop(1, 'rgba(180, 0, 90, 0)');
      cineCtx.fillStyle = g;
      cineCtx.beginPath();
      cineCtx.arc(0, 0, rGlow, 0, Math.PI * 2);
      cineCtx.fill();

      const numRays = 28;
      for (let i = 0; i < numRays; i++) {
        const angle = (i / numRays) * Math.PI * 2 + 0.15;
        const isLong = i % 2 === 0;
        const isDiag = i % 7 === 0;
        const rayLen = (isDiag ? 148 : (isLong ? 96 : 52)) * intensity * scaleFactor;

        const rayGrad = cineCtx.createLinearGradient(0, 0, Math.cos(angle) * rayLen, Math.sin(angle) * rayLen);
        rayGrad.addColorStop(0, `rgba(255, 255, 255, ${intensity})`);
        rayGrad.addColorStop(0.45, `rgba(255, 130, 205, ${intensity * 0.75})`);
        rayGrad.addColorStop(1, 'rgba(255, 20, 147, 0)');

        cineCtx.strokeStyle = rayGrad;
        cineCtx.lineWidth = (isDiag ? 2.2 : 1.1) * scaleFactor;
        cineCtx.beginPath();
        cineCtx.moveTo(0, 0);
        cineCtx.lineTo(Math.cos(angle) * rayLen, Math.sin(angle) * rayLen);
        cineCtx.stroke();
      }
      cineCtx.restore();
    }

    function drawPinkDetailedButterfly(x, y, baseScale, flapPhase, tiltRot, perspectiveTilt, isHero = true) {
      cineCtx.save();
      cineCtx.translate(x, y);
      cineCtx.rotate(tiltRot);

      const flap = Math.cos(flapPhase);
      const wingLift = Math.sin(flapPhase) * 12 * baseScale;

      for (let side of [-1, 1]) {
        cineCtx.save();
        const sidePerspective = side === 1 ? (1 + perspectiveTilt * 0.15) : (1 - perspectiveTilt * 0.15);
        const horizCompress = (0.18 + 0.82 * Math.abs(flap)) * sidePerspective;

        cineCtx.transform(side * horizCompress, side * wingLift * 0.008, 0, 1, 0, 0);
        const S = baseScale;

        // Cánh trên (Forewing)
        cineCtx.beginPath();
        cineCtx.moveTo(0, -6 * S);
        cineCtx.bezierCurveTo(22 * S, -55 * S, 82 * S, -75 * S, 98 * S, -42 * S);
        cineCtx.bezierCurveTo(104 * S, -22 * S, 88 * S, 4 * S, 68 * S, 12 * S);
        cineCtx.bezierCurveTo(42 * S, 18 * S, 15 * S, 10 * S, 0, 2 * S);
        cineCtx.closePath();

        const foreGrad = cineCtx.createRadialGradient(5 * S, -5 * S, 2 * S, 45 * S, -25 * S, 95 * S);
        foreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
        foreGrad.addColorStop(0.32, 'rgba(255, 185, 225, 0.88)');
        foreGrad.addColorStop(0.72, 'rgba(255, 30, 135, 0.78)');
        foreGrad.addColorStop(1, 'rgba(255, 225, 245, 0.96)');

        cineCtx.fillStyle = foreGrad;
        cineCtx.shadowColor = '#ff1493';
        cineCtx.shadowBlur = isHero ? 28 : 10;
        cineCtx.fill();

        cineCtx.lineWidth = (isHero ? 2.2 : 1.0) * S;
        cineCtx.strokeStyle = 'rgba(255, 242, 250, 0.95)';
        cineCtx.stroke();

        // Cánh dưới có đuôi nhọn (Swallowtail Hindwing)
        cineCtx.beginPath();
        cineCtx.moveTo(0, 2 * S);
        cineCtx.bezierCurveTo(25 * S, 10 * S, 68 * S, 22 * S, 62 * S, 48 * S);
        cineCtx.bezierCurveTo(56 * S, 64 * S, 42 * S, 70 * S, 36 * S, 86 * S);
        cineCtx.bezierCurveTo(28 * S, 72 * S, 18 * S, 68 * S, 10 * S, 55 * S);
        cineCtx.bezierCurveTo(4 * S, 38 * S, 2 * S, 20 * S, 0, 8 * S);
        cineCtx.closePath();

        const hindGrad = cineCtx.createRadialGradient(5 * S, 10 * S, 2 * S, 30 * S, 45 * S, 80 * S);
        hindGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
        hindGrad.addColorStop(0.4, 'rgba(255, 170, 220, 0.85)');
        hindGrad.addColorStop(0.8, 'rgba(230, 20, 120, 0.8)');
        hindGrad.addColorStop(1, 'rgba(255, 235, 248, 0.95)');

        cineCtx.fillStyle = hindGrad;
        cineCtx.fill();
        cineCtx.stroke();

        // Hệ thống gân cánh bướm (Wing Veins)
        if (isHero) {
          cineCtx.save();
          cineCtx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
          cineCtx.lineWidth = 1.25 * S;
          cineCtx.shadowBlur = 6;
          cineCtx.shadowColor = '#ffffff';

          cineCtx.beginPath();
          cineCtx.moveTo(2 * S, -4 * S);
          cineCtx.quadraticCurveTo(38 * S, -32 * S, 62 * S, -34 * S);
          cineCtx.quadraticCurveTo(38 * S, -14 * S, 2 * S, 0);
          cineCtx.stroke();

          const foreVeins = [
            [35, -28, 86, -48],
            [48, -32, 95, -34],
            [58, -32, 92, -18],
            [52, -22, 82, -2],
            [38, -14, 65, 10]
          ];
          foreVeins.forEach(v => {
            cineCtx.beginPath();
            cineCtx.moveTo(v[0] * S, v[1] * S);
            cineCtx.quadraticCurveTo(((v[0] + v[2]) / 2) * S, (v[1] - 4) * S, v[2] * S, v[3] * S);
            cineCtx.stroke();
          });

          const hindVeins = [
            [4, 4, 56, 36],
            [4, 6, 52, 54],
            [4, 6, 36, 80],
            [3, 8, 20, 62]
          ];
          hindVeins.forEach(v => {
            cineCtx.beginPath();
            cineCtx.moveTo(v[0] * S, v[1] * S);
            cineCtx.quadraticCurveTo(((v[0] + v[2]) * 0.55) * S, ((v[1] + v[3]) * 0.45) * S, v[2] * S, v[3] * S);
            cineCtx.stroke();
          });
          cineCtx.restore();
        }
        cineCtx.restore();
      }

      const S = baseScale;
      const bodyGlow = cineCtx.createRadialGradient(0, 8 * S, 0, 0, 8 * S, 38 * S);
      bodyGlow.addColorStop(0, 'rgba(255, 255, 255, 1)');
      bodyGlow.addColorStop(0.35, 'rgba(255, 200, 235, 0.88)');
      bodyGlow.addColorStop(1, 'rgba(255, 20, 147, 0)');
      cineCtx.fillStyle = bodyGlow;
      cineCtx.beginPath();
      cineCtx.arc(0, 8 * S, 38 * S, 0, Math.PI * 2);
      cineCtx.fill();

      cineCtx.fillStyle = '#ffffff';
      cineCtx.shadowColor = '#ffffff';
      cineCtx.shadowBlur = 18;
      cineCtx.beginPath();
      cineCtx.ellipse(0, 10 * S, 3.8 * S, 24 * S, 0, 0, Math.PI * 2);
      cineCtx.fill();

      if (isHero) {
        cineCtx.strokeStyle = 'rgba(255, 235, 248, 0.9)';
        cineCtx.lineWidth = 1.1 * S;
        for (let side of [-1, 1]) {
          cineCtx.beginPath();
          cineCtx.moveTo(side * 2 * S, -12 * S);
          cineCtx.quadraticCurveTo(side * 14 * S, -34 * S, side * 26 * S, -38 * S);
          cineCtx.stroke();
        }
      }
      cineCtx.restore();
    }

    let v2StartTime = 0;
    let v2BloomShakeDone = false;

    function renderVideo2PinkButterfly(now) {
      const elapsed = (now - v2StartTime) / 1000;
      const scaleFactor = Math.min(CW, CH) / 720;

      // Chạy đúng 1 vòng lặp 10.0 giây rồi chuyển sang Quả Cầu Ảnh 3D
      if (elapsed >= 10.0) {
        cineCanvas.classList.remove('active');
        camShake.trigger(1.8);
        runScene4SeamlessSphere();
        return;
      }

      cineCtx.clearRect(0, 0, CW, CH);
      cineCtx.globalCompositeOperation = 'lighter';

      const heartCenterX = CW * 0.5;
      const heartCenterY = CH * 0.37;
      const heartScale = 11.2 * scaleFactor;
      const bottomTip = getV2HeartCoord(0, heartScale, heartCenterX, heartCenterY);

      // 1. Hồ Ánh Sáng Hồng & Sóng Nước Phản Quang Dưới Đáy
      const poolX = heartCenterX;
      const poolY = CH * 0.84;

      const poolGrad = cineCtx.createRadialGradient(poolX, poolY, 2, poolX, poolY, 210 * scaleFactor);
      poolGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
      poolGrad.addColorStop(0.24, 'rgba(255, 140, 205, 0.88)');
      poolGrad.addColorStop(0.58, 'rgba(233, 30, 99, 0.45)');
      poolGrad.addColorStop(1, 'rgba(90, 0, 45, 0)');

      cineCtx.save();
      cineCtx.translate(poolX, poolY);
      cineCtx.scale(1.35, 0.17);
      cineCtx.fillStyle = poolGrad;
      cineCtx.beginPath();
      cineCtx.arc(0, 0, 210 * scaleFactor, 0, Math.PI * 2);
      cineCtx.fill();

      if (elapsed > 2.2) {
        const rippleAlpha = Math.min(1, (elapsed - 2.2) / 1.0);
        cineCtx.strokeStyle = `rgba(255, 190, 230, ${rippleAlpha * 0.48})`;
        cineCtx.lineWidth = 2.5;
        for (let r = 1; r <= 5; r++) {
          const rad = ((r * 32 + elapsed * 25) % 165) * scaleFactor;
          cineCtx.beginPath();
          cineCtx.arc(0, 0, rad, 0, Math.PI * 2);
          cineCtx.stroke();
        }
      }
      cineCtx.restore();

      // 2. Hai Tia Sáng Vẽ Khung Trái Tim (0.0s -> 2.7s)
      const leftProgress = Math.min(Math.PI, (0.45 + (elapsed / 2.6) * 0.55) * Math.PI);
      const rightProgress = Math.min(Math.PI, (0.25 + (elapsed / 2.7) * 0.75) * Math.PI);
      const galaxyBloom = elapsed < 2.6 ? 0 : Math.min(1, (elapsed - 2.6) / 1.2);

      if (elapsed >= 2.6 && !v2BloomShakeDone) {
        v2BloomShakeDone = true;
        camShake.trigger(1.5);
        audio.chime();
      }

      cineCtx.save();
      cineCtx.beginPath();
      const steps = 140;
      for (let i = steps; i >= 0; i--) {
        const u = -(i / steps) * leftProgress;
        const pt = getV2HeartCoord(u, heartScale, heartCenterX, heartCenterY);
        if (i === steps) cineCtx.moveTo(pt.x, pt.y);
        else cineCtx.lineTo(pt.x, pt.y);
      }
      for (let i = 1; i <= steps; i++) {
        const u = (i / steps) * rightProgress;
        const pt = getV2HeartCoord(u, heartScale, heartCenterX, heartCenterY);
        cineCtx.lineTo(pt.x, pt.y);
      }
      cineCtx.strokeStyle = `rgba(255, 185, 225, ${0.88 - galaxyBloom * 0.35})`;
      cineCtx.lineWidth = (3.8 + galaxyBloom * 3.0) * scaleFactor;
      cineCtx.shadowColor = '#ff1493';
      cineCtx.shadowBlur = 28;
      cineCtx.stroke();
      cineCtx.restore();

      if (elapsed < 2.75) {
        const headL = getV2HeartCoord(-leftProgress, heartScale, heartCenterX, heartCenterY);
        const headR = getV2HeartCoord(rightProgress, heartScale, heartCenterX, heartCenterY);
        const headSize = 36 * scaleFactor;
        cineCtx.drawImage(spriteBlushWhite, headL.x - headSize / 2, headL.y - headSize / 2, headSize, headSize);
        cineCtx.drawImage(spriteBlushWhite, headR.x - headSize / 2, headR.y - headSize / 2, headSize, headSize);
      }

      // 3. Vẽ 1.850 Hạt Bụi Sao Ngân Hà Hồng Quanh Viền Trái Tim
      v2RingParticles.forEach(p => {
        const isVisible = (p.u < 0 && -p.u <= leftProgress) || (p.u >= 0 && p.u <= rightProgress);
        if (!isVisible) return;

        const basePt = getV2HeartCoord(p.u, heartScale, heartCenterX, heartCenterY);
        const spreadMult = (0.38 + galaxyBloom * 0.95 * p.burstFactor) * scaleFactor;
        const angle = p.offsetAngle + elapsed * 0.35;
        const px = basePt.x + Math.cos(angle) * p.offsetDist * spreadMult;
        const py = basePt.y + Math.sin(angle) * p.offsetDist * spreadMult;

        const twinkle = 0.35 + 0.65 * Math.sin(elapsed * p.twinkleSpeed + p.phase);
        const sz = p.size * scaleFactor * (0.7 + 0.4 * galaxyBloom) * twinkle;

        cineCtx.globalAlpha = Math.min(1, twinkle * (0.65 + 0.35 * galaxyBloom));
        cineCtx.drawImage(
          p.isBright ? spriteBlushWhite : spriteHotPink,
          px - sz / 2,
          py - sz / 2,
          sz,
          sz
        );
      });
      cineCtx.globalAlpha = 1;

      if (elapsed > 2.2) {
        const sigPt = getV2HeartCoord(1.1, heartScale, heartCenterX, heartCenterY);
        cineCtx.save();
        cineCtx.translate(sigPt.x + 26 * scaleFactor, sigPt.y + 18 * scaleFactor);
        cineCtx.rotate(-0.68);
        cineCtx.font = `${Math.round(12 * scaleFactor)}px Consolas, sans-serif`;
        cineCtx.fillStyle = `rgba(255, 190, 230, ${Math.min(0.55, (elapsed - 2.2) * 0.4)})`;
        cineCtx.fillText('AurumWaTe', 0, 0);
        cineCtx.restore();
      }

      // 4. Vẽ Trái Tim Nhỏ 3D Màu Hồng Bay Quanh Sườn Trái (0.0s -> 3.6s)
      if (elapsed < 3.6) {
        const heartAlpha = elapsed < 2.2 ? 1.0 : Math.max(0, 1 - (elapsed - 2.2) / 1.4);
        v2MiniHearts.forEach(mh => {
          const base = getV2HeartCoord(mh.u, heartScale, heartCenterX, heartCenterY);
          const hx = base.x + mh.spreadX * scaleFactor + Math.cos(elapsed * mh.floatSpeed + mh.phase) * 6;
          const hy = base.y + mh.spreadY * scaleFactor - elapsed * 10 * scaleFactor;
          drawPinkMiniHeart3D(hx, hy, mh.size * scaleFactor, mh.rot, mh.shade, heartAlpha * 0.88);
        });
      }

      // 5. Vẽ 9 Chú Bướm Nhỏ Phát Sáng Hồng Đậu Quanh Viền Trái Tim
      if (elapsed > 1.6) {
        const miniBAlpha = Math.min(1, (elapsed - 1.6) / 1.2);
        cineCtx.save();
        cineCtx.globalAlpha = miniBAlpha;
        v2PerimeterButterflies.forEach(mb => {
          const pt = getV2HeartCoord(mb.u, heartScale, heartCenterX, heartCenterY);
          drawPinkDetailedButterfly(
            pt.x,
            pt.y,
            mb.size * scaleFactor,
            elapsed * 8.5 + mb.phase,
            mb.rot,
            0.2,
            false
          );
        });
        cineCtx.restore();
      }

      // 6. Vẽ Dải Hạt Chữ S Nối Từ Đáy Trái Tim Xuống Lưng Chú Bướm Lớn
      if (elapsed > 1.4) {
        const streamAlpha = Math.min(1, (elapsed - 1.4) / 1.2);
        const startX = bottomTip.x;
        const startY = bottomTip.y;
        const endX = poolX - 5 * scaleFactor;
        const endY = poolY - 15 * scaleFactor;

        v2StreamParticles.forEach(sp => {
          const p = (sp.progress + elapsed * sp.speed) % 1.0;
          const sCurve = Math.sin(p * Math.PI * 1.35) * -28 * scaleFactor;
          const sx = startX * (1 - p) + endX * p + sCurve + Math.cos(elapsed * 3 + sp.phase) * sp.spread * scaleFactor * (0.3 + p * 0.7);
          const sy = startY * (1 - p) + endY * p;

          const sz = sp.size * scaleFactor * (0.5 + 0.5 * Math.sin(elapsed * 5 + sp.phase));
          cineCtx.globalAlpha = streamAlpha * (1 - Math.abs(p - 0.5) * 0.6);
          cineCtx.drawImage(spriteHotPink, sx - sz / 2, sy - sz / 2, sz, sz);
        });
        cineCtx.globalAlpha = 1;
      }

      // 7. Vẽ Tâm Sáng Đa Tia (Starburst Flare) Ở Đáy Nhọn Trái Tim (0.0s -> 3.2s)
      if (elapsed < 3.2) {
        let flareInt = 1.0;
        if (elapsed < 1.2) flareInt = 0.85 + 0.25 * Math.sin(elapsed * 8);
        else flareInt = Math.max(0, 1 - (elapsed - 1.2) / 2.0);
        drawPinkStarburstFlare(bottomTip.x, bottomTip.y, flareInt, scaleFactor);
      }

      // 8. Quỹ Đạo Bay & Vỗ Cánh 3D Của Chú Bướm Chúa Màu Hồng
      let bx, by, bScale, bRot, bFlap, bPerspective;
      if (elapsed < 1.25) {
        const t = elapsed / 1.25;
        const ease = t * t * (3 - 2 * t);
        const startBx = heartCenterX + 85 * scaleFactor;
        const startBy = heartCenterY - 35 * scaleFactor;
        bx = startBx * (1 - ease) + bottomTip.x * ease;
        by = startBy * (1 - ease) + (bottomTip.y + 8 * scaleFactor) * ease;
        bScale = (0.48 + 0.15 * ease) * scaleFactor;
        bRot = -0.45 * (1 - ease);
        bFlap = elapsed * 11;
        bPerspective = -0.35;
      } else if (elapsed < 2.5) {
        const t = (elapsed - 1.25) / 1.25;
        const ease = t * t * (3 - 2 * t);
        bx = bottomTip.x * (1 - ease) + (poolX - 8 * scaleFactor) * ease;
        by = (bottomTip.y + 8 * scaleFactor) * (1 - ease) + (poolY - 22 * scaleFactor) * ease;
        bScale = (0.63 + 0.52 * ease) * scaleFactor;
        bRot = -0.08 * ease;
        bFlap = Math.PI * 0.5 + t * Math.PI * 1.5;
        bPerspective = 0.25 * ease;
      } else if (elapsed < 8.3) {
        const hover = Math.sin((elapsed - 2.5) * 2.6);
        bx = poolX - 8 * scaleFactor + Math.cos(elapsed * 1.5) * 4 * scaleFactor;
        by = poolY - 24 * scaleFactor + hover * 6 * scaleFactor;
        bScale = 1.15 * scaleFactor;
        bRot = -0.08 + Math.sin(elapsed * 1.8) * 0.03;
        bFlap = (elapsed - 2.5) * 4.2;
        bPerspective = 0.32;
      } else {
        const t = (elapsed - 8.3) / 1.7;
        const ease = t * t;
        bx = (poolX - 8 * scaleFactor) + ease * 210 * scaleFactor;
        by = (poolY - 24 * scaleFactor) - Math.sin(t * Math.PI) * 35 * scaleFactor + ease * 20 * scaleFactor;
        bScale = (1.15 + ease * 0.85) * scaleFactor;
        bRot = -0.14 - ease * 0.12;
        bFlap = (elapsed - 2.5) * 6.5;
        bPerspective = 0.45;
      }

      drawPinkDetailedButterfly(bx, by, bScale, bFlap, bRot, bPerspective, true);
    }

    // =========================================================================

    function morphParticles(coords, cols, scanPeak = 0.95, dur = 1.0) {
      const posArr = pGeo.attributes.position.array;
      const tarArr = pGeo.attributes.aTarget.array;
      const colArr = pGeo.attributes.aColor.array;

      for (let i = 0; i < P_COUNT * 3; i++) {
        posArr[i] = posArr[i] + (tarArr[i] - posArr[i]) * pUniforms.uMorph.value;
        tarArr[i] = coords[i];
        colArr[i] = cols[i];
      }
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.aTarget.needsUpdate = true;
      pGeo.attributes.aColor.needsUpdate = true;

      pUniforms.uMorph.value = 0;
      gsap.to(pUniforms.uMorph, { value: 1, duration: dur, ease: 'power3.inOut' });

      if (scanPeak > 0) {
        gsap.fromTo(pUniforms.uScanline, { value: 0 }, {
          value: scanPeak,
          duration: dur * 0.42,
          yoyo: true,
          repeat: 1,
          ease: 'sine.inOut'
        });
      }
    }

    function sampleTextToParticles(txt) {
      const c = document.createElement('canvas');
      c.width = 640;

    // Tạo tấm ảnh cong 3D (Curved Tangent Photo Card) giúp giữ tỷ lệ vuông/chữ nhật chuẩn 100%
    function createCurvedPhotoCardGeometry(width, height, radius, segs = 8) {
      const geo = new THREE.PlaneGeometry(width, height, segs, segs);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const zCurve = Math.sqrt(Math.max(1, radius * radius - x * x - y * y)) - radius;
        pos.setZ(i, zCurve);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function buildSeamlessWatertightPhotoSphere() {
      const mems = window.LOVE_CONFIG.girlfriendMemories;
      const loadedTextures = [];

      for (let i = 0; i < 10; i++) {
        const fbCanvas = createFallbackBeautyPortrait(i);
        const tex = new THREE.CanvasTexture(fbCanvas);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = 520;
          c.height = 520;
          const ctx = c.getContext('2d');

          // Cắt ảnh chuẩn tỷ lệ 1:1 lấy tâm khuôn mặt (0.5, 0.24) để không bao giờ bị méo hay mất đầu
          drawSmartCoverImage(ctx, img, 0, 0, 520, 520, 0.5, 0.24);

          // Viền khung ảnh hồng sáng sang trọng
          ctx.strokeStyle = 'rgba(255, 130, 195, 0.85)';
          ctx.lineWidth = 14;
          ctx.strokeRect(7, 7, 506, 506);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.lineWidth = 4;
          ctx.strokeRect(16, 16, 488, 488);

          tex.image = c;
          tex.needsUpdate = true;
        };
        img.src = mems[i].url;
        loadedTextures.push(tex);
      }

      const thetaMin = Math.PI * 0.16;
      const thetaMax = Math.PI * 0.84;
      const dTheta = (thetaMax - thetaMin) / (ROWS - 1);
      const dPhi = (Math.PI * 2) / COLS;

      const cardSize = 13.8;
      const sharedCardGeo = createCurvedPhotoCardGeometry(cardSize, cardSize, SPHERE_R, 8);

      let tileIndex = 0;
      for (let r = 0; r < ROWS; r++) {
        const theta = thetaMin + r * dTheta;
        for (let c = 0; c < COLS; c++) {
          const phi = c * dPhi + (r % 2) * (dPhi * 0.5);
          const memIdx = tileIndex % 10;

          const sx = SPHERE_R * Math.sin(theta) * Math.sin(phi);
          const sy = SPHERE_R * Math.cos(theta);
          const sz = SPHERE_R * Math.sin(theta) * Math.cos(phi);
          const spherePos = new THREE.Vector3(sx, sy, sz);

          const dummy = new THREE.Object3D();
          dummy.position.copy(spherePos);
          dummy.lookAt(sx * 2, sy * 2, sz * 2);
          const sphereRot = dummy.rotation.clone();

          const mat = new THREE.MeshBasicMaterial({
            map: loadedTextures[memIdx],
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 1.0
          });

          const mesh = new THREE.Mesh(sharedCardGeo, mat);
          mesh.position.copy(spherePos);
          mesh.rotation.copy(sphereRot);

          const ht = (tileIndex / (ROWS * COLS)) * Math.PI * 2;
          const hx = 16 * Math.pow(Math.sin(ht), 3) * 2.25;
          const hy = (13 * Math.cos(ht) - 5 * Math.cos(2 * ht) - 2 * Math.cos(3 * ht) - Math.cos(4 * ht)) * 2.25 + 4;
          const hz = ((tileIndex % 3) - 1) * 6;

          mesh.userData = {
            tileId: tileIndex,
            memoryIndex: memIdx,
            spherePos,
            sphereRot,
            galaxyPos: new THREE.Vector3(
              (Math.random() - 0.5) * 165,
              (Math.random() - 0.5) * 155,
              (Math.random() - 0.5) * 140
            ),
            heartPos: new THREE.Vector3(hx, hy, hz)
          };

          tileMeshes.push(mesh);
          sphereGalleryGroup.add(mesh);
          tileIndex++;
        }
      }
    }

    let bouquetClickable = false;
    function runScene3Bouquet() {
      currentScene = SCENE.BOUQUET;
      audio.chime();
      camShake.trigger(1.3);
      morphParticles(bouquetParticleData.coords, bouquetParticleData.cols, 1.05, 0.95);

      setTimeout(() => {
        bouquetMesh.visible = true;
        gsap.to(bouquetMesh.material, { opacity: 1, duration: 0.7 });
        gsap.to(pMat, { opacity: 0.12, duration: 0.7 });
        bouquetClickable = true;
      }, 800);
    }

    // Sau khi Bó Hoa tan biến -> Chạy Hiệu ứng Video 2 Màu Hồng đúng 1 vòng lặp (10s)
    function shatterBouquetToVideo2() {
      if (!bouquetClickable) return;
      bouquetClickable = false;
      audio.chime();
      camShake.trigger(2.5);
      spawnTouchFX(window.innerWidth / 2, window.innerHeight / 2, true);

      gsap.to(bouquetMesh.material, {
        opacity: 0,
        duration: 0.25,
        onComplete: () => (bouquetMesh.visible = false)
      });

      gsap.to(pUniforms.uWarp, {
        value: 1.0,
        duration: 0.8,
        ease: 'power2.in',
        onComplete: () => {
          particleSystem.visible = false;
          startSceneVideo2Butterfly();
        }
      });
    }

    function startSceneVideo2Butterfly() {
      currentScene = SCENE.VIDEO2_BUTTERFLY;
      v2StartTime = performance.now();
      v2BloomShakeDone = false;
      cineCanvas.classList.add('active');
      camShake.trigger(1.8);
      audio.chime();
    }

    function runScene4SeamlessSphere() {
      currentScene = SCENE.SPHERE_GALAXY;
      sphereGalleryGroup.visible = true;
      baseCamPos.set(0, 0, 74);

      tileMeshes.forEach((m, i) => {
        m.position.copy(m.userData.galaxyPos);
        m.rotation.copy(m.userData.sphereRot);
        gsap.to(m.position, {
          x: m.userData.spherePos.x,
          y: m.userData.spherePos.y,
          z: m.userData.spherePos.z,
          duration: 1.05,
          delay: i * 0.004,
          ease: 'power3.out'
        });
      });

      setTimeout(() => {
        gsap.to(baseCamPos, { z: 92, duration: 0.75, ease: 'power2.inOut' });
        topRightHud.classList.add('show');
        bottomBar.classList.add('show');
      }, 800);
    }

    // =========================================================================
    // POPUP GHI CHÚ KỶ NIỆM & PHONG BÌ THIÊN THẦN MỞ THƯ
    // =========================================================================
    const notePopup = document.getElementById('memory-note-popup');
    const mnBadge = document.getElementById('mn-badge');
    const mnImg = document.getElementById('mn-img');
    const mnImgBlur = document.getElementById('mn-img-blur');
    const mnTitle = document.getElementById('mn-title');
    const mnDesc = document.getElementById('mn-desc');
    const mnClose = document.getElementById('mn-close');
    const mnNext = document.getElementById('mn-next');
    const mnOpenLetter = document.getElementById('mn-open-letter');

    let currentMemIndex = 0;

    function showMemoryNoteModal(idx) {
      currentMemIndex = (idx + 10) % 10;
      const item = window.LOVE_CONFIG.girlfriendMemories[currentMemIndex];

      audio.chime();
      viewedMemoryIds.add(currentMemIndex);
      hudNoteCounter.textContent = `💌 Đã xem: ${viewedMemoryIds.size}/10 ghi chú`;

      mnBadge.textContent = `Ghi chú kỷ niệm #${currentMemIndex + 1} / 10`;
      mnImg.onload = () => {
        mnImgBlur.src = mnImg.src;
      };
      mnImg.onerror = () => {
        const fb = createFallbackBeautyPortrait(currentMemIndex).toDataURL();
        mnImg.src = fb;
        mnImgBlur.src = fb;
      };
      mnImg.src = item.url;
      mnTitle.textContent = item.title;
      mnDesc.textContent = item.note;

      notePopup.classList.add('open');
    }

    mnClose.addEventListener('pointerdown', () => notePopup.classList.remove('open'));
    mnNext.addEventListener('pointerdown', () => showMemoryNoteModal(currentMemIndex + 1));
    mnOpenLetter.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      notePopup.classList.remove('open');
      triggerWingedEnvelopeNow();
    });

    btnInstantLetter.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      triggerWingedEnvelopeNow();
    });

    const angelEnvelopeWrap = document.getElementById('angel-envelope-wrap');
    const finalLetterModal = document.getElementById('final-letter-modal');
    const expandingCard = document.getElementById('expanding-card');
    const letterBoxInner = document.getElementById('letter-box-inner');
    const letterTitleEl = document.getElementById('letter-title-el');
    const letterBodyEl = document.getElementById('letter-body-el');
    const letterCoupleWrap = document.getElementById('letter-couple-wrap');

    let letterHasOpened = false;
    let autoOpenEnvelopeTimer = null;

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => {
        if (letterHasOpened && !expandingCard.classList.contains('finished-expanding')) {
          expandingCard.style.height = (letterBoxInner.scrollHeight + 52) + 'px';
        }
      });
      ro.observe(letterBoxInner);
    }

    function updateExpandingHeight() {
      if (!expandingCard.classList.contains('finished-expanding')) {
        expandingCard.style.height = (letterBoxInner.scrollHeight + 52) + 'px';
      }
    }

    function triggerWingedEnvelopeNow() {
      if (currentScene === SCENE.LETTER) return;
      currentScene = SCENE.LETTER;

      notePopup.classList.remove('open');
      topRightHud.classList.remove('show');
      bottomBar.classList.remove('show');
      audio.chime();
      camShake.trigger(1.2);

      tileMeshes.forEach((m, i) => {
        gsap.to(m.position, {
          y: m.position.y + 140,
          duration: 0.45,
          delay: i * 0.001,
          ease: 'power2.inOut'
        });
        gsap.to(m.material, { opacity: 0, duration: 0.4 });
      });

      setTimeout(() => {
        angelEnvelopeWrap.classList.add('active');
        autoOpenEnvelopeTimer = setTimeout(() => {
          openFinalLoveLetterNow();
        }, 1400);
      }, 50);
    }

    function openFinalLoveLetterNow(e) {
      if (letterHasOpened) return;
      letterHasOpened = true;
      clearTimeout(autoOpenEnvelopeTimer);

      audio.chime();
      camShake.trigger(1.0);
      if (e && e.clientX) {
        spawnTouchFX(e.clientX, e.clientY, true);
      } else {
        spawnTouchFX(window.innerWidth / 2, window.innerHeight / 2, true);
      }

      angelEnvelopeWrap.style.opacity = '0';
      angelEnvelopeWrap.style.pointerEvents = 'none';

      setTimeout(() => {
        angelEnvelopeWrap.style.display = 'none';
        startTypewriterLoveLetter();
      }, 60);
    }

    angelEnvelopeWrap.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      openFinalLoveLetterNow(e);
    });
    angelEnvelopeWrap.addEventListener('click', (e) => {
      e.stopPropagation();
      openFinalLoveLetterNow(e);
    });

    function startTypewriterLoveLetter() {
      finalLetterModal.classList.add('open');
      const titleStr = window.LOVE_CONFIG.letter.title;
      const bodyStr = window.LOVE_CONFIG.letter.lines.join('\n\n');

      let tIdx = 0;
      const tTimer = setInterval(() => {
        tIdx++;
        letterTitleEl.innerHTML = titleStr.slice(0, tIdx) + '<span class="caret-bar"></span>';
        audio.typeTick();
        updateExpandingHeight();

        if (tIdx >= titleStr.length) {
          clearInterval(tTimer);
          letterTitleEl.textContent = titleStr;
          setTimeout(typeBodyParagraphs, 90);
        }
      }, 28);

      function typeBodyParagraphs() {
        let bIdx = 0;
        const bTimer = setInterval(() => {
          bIdx += 2;
          letterBodyEl.innerHTML = bodyStr.slice(0, bIdx) + '<span class="caret-bar"></span>';
          if (bIdx % 4 === 0) audio.typeTick();
          updateExpandingHeight();

          if (bIdx >= bodyStr.length) {
            clearInterval(bTimer);
            letterBodyEl.textContent = bodyStr;

            letterCoupleWrap.style.display = 'flex';
            requestAnimationFrame(() => {
              letterCoupleWrap.classList.add('show-photo');
              updateExpandingHeight();
              setTimeout(() => {
                expandingCard.classList.add('finished-expanding');
              }, 220);
            });
          }
        }, 24);
      }
    }

    // =========================================================================
    // TƯƠNG TÁC XOAY QUẢ CẦU 3D & CHỌN ẢNH
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let isDown = false;
    let downPos = { x: 0, y: 0 };
    let prevPos = { x: 0, y: 0 };
    let rotVelocity = { x: 0, y: 0 };
    let downStamp = 0;
    let pinchStart = 0;

    window.addEventListener('pointerdown', (e) => {
      audio.startMusic();
      spawnTouchFX(e.clientX, e.clientY, false);
      if (e.target.closest('.interactive')) return;

      isDown = true;
      downPos = { x: e.clientX, y: e.clientY };
      prevPos = { x: e.clientX, y: e.clientY };
      downStamp = performance.now();

      if (currentScene === SCENE.BOUQUET && bouquetClickable) {
        shatterBouquetToVideo2();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (Math.random() < 0.45) spawnTouchFX(e.clientX, e.clientY, false);
      if (!isDown) return;

      const dx = e.clientX - prevPos.x;
      const dy = e.clientY - prevPos.y;

      if (currentScene === SCENE.SPHERE_GALAXY) {
        rotVelocity.y = dx * 0.0075;
        rotVelocity.x = dy * 0.0075;
        sphereGalleryGroup.rotation.y += rotVelocity.y;
        sphereGalleryGroup.rotation.x = Math.max(-0.85, Math.min(0.85, sphereGalleryGroup.rotation.x + rotVelocity.x));
      }
      prevPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDown) return;
      isDown = false;

      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      const dt = performance.now() - downStamp;

      if (dist < 10 && dt < 300 && currentScene === SCENE.SPHERE_GALAXY && !notePopup.classList.contains('open')) {
        pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(tileMeshes);
        if (hits.length > 0) {
          spawnTouchFX(e.clientX, e.clientY, true);
          const memIdx = hits[0].object.userData.memoryIndex;
          showMemoryNoteModal(memIdx);
        }
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && currentScene === SCENE.SPHERE_GALAXY) {
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (pinchStart > 0) {
          baseCamPos.z = Math.max(35, Math.min(145, baseCamPos.z - (d - pinchStart) * 0.25));
        }
        pinchStart = d;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => (pinchStart = 0));

    window.addEventListener('wheel', (e) => {
      if (currentScene === SCENE.SPHERE_GALAXY) {
        baseCamPos.z = Math.max(35, Math.min(145, baseCamPos.z + e.deltaY * 0.08));
      }
    });

    document.getElementById('audio-btn').addEventListener('pointerdown', (e) => {
      const on = audio.toggle();
      e.currentTarget.textContent = on ? '🔊' : '🔇';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      CW = cineCanvas.width = window.innerWidth;
      CH = cineCanvas.height = window.innerHeight;
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    });

    // =========================================================================
    // VÒNG LẶP RENDER TỔNG HỢP 60FPS
    // =========================================================================
    const clock = new THREE.Clock();

    function animate(now) {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      pUniforms.uTime.value = t;

      // Cập nhật độ rung camera điện ảnh
      camShake.update(t);
      camera.position.set(
        baseCamPos.x + camShake.offsetX,
        baseCamPos.y + camShake.offsetY,
        baseCamPos.z
      );

      updateAndDrawTouchFX();
      starField.rotation.y = t * 0.015;

      // Render Hiệu ứng Video 1 (Trái Tim Hạt 3D Hồng) hoặc Video 2 (Bướm 3D Hồng)
      if (currentScene === SCENE.VIDEO1_HEART) {
        renderVideo1PinkHeart(now);
      } else if (currentScene === SCENE.VIDEO2_BUTTERFLY) {
        renderVideo2PinkButterfly(now);
      }

      if (bouquetMesh && bouquetMesh.visible) {
        bouquetMesh.position.y = Math.sin(t * 2.1) * 1.2;
        bouquetMesh.rotation.z = Math.sin(t * 1.5) * 0.025;
      }

      if (currentScene === SCENE.SPHERE_GALAXY && !isDown) {
        sphereGalleryGroup.rotation.y += rotVelocity.y;
        sphereGalleryGroup.rotation.x += rotVelocity.x;
        rotVelocity.x *= 0.94;
        rotVelocity.y *= 0.94;

        if (Math.abs(rotVelocity.y) < 0.002 && currentGalleryMode === 'sphere') {
          sphereGalleryGroup.rotation.y += 0.0032;
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
